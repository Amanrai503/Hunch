services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hunch_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hunch
    ports:
      - "5432:5432"
    volumes:
      - hunch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hunch_pgdata:

